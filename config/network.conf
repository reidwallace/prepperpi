# Network configuration for PrepperPi
# Sensitive values (passwords, IPs) should be set in config/.env

# Load per-machine overrides from .env if present
if [ -f "$(dirname "${BASH_SOURCE[0]}")/.env" ]; then
    source "$(dirname "${BASH_SOURCE[0]}")/.env"
fi

# Access Point settings
WIFI_SSID="${WIFI_SSID:-PrepperPi}"
WIFI_PSK="${WIFI_PSK:-}"
WIFI_CHANNEL="${WIFI_CHANNEL:-6}"
WIFI_COUNTRY="${WIFI_COUNTRY:-US}"

# LAN/static addressing
LAN_INTERFACE="${LAN_INTERFACE:-eth0}"
PI_IP="${PI_IP:-}"
LAN_NETMASK="${LAN_NETMASK:-255.255.255.0}"
SUBNET="${SUBNET:-}"
DHCP_START="${DHCP_START:-}"
DHCP_END="${DHCP_END:-}"
