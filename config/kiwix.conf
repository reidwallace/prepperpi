# =============================================================================
# STORAGE PROFILES
# =============================================================================

# Load per-machine overrides from .env if present
if [ -f "$(dirname "${BASH_SOURCE[0]}")/.env" ]; then
    source "$(dirname "${BASH_SOURCE[0]}")/.env"
fi

STORAGE_PROFILE="${STORAGE_PROFILE:-minimal}"
echo "Storage profile: $STORAGE_PROFILE"

case $STORAGE_PROFILE in
    "minimal")
        # ~17GB
        CONTENT_SOURCES=(
            "https://download.kiwix.org/zim/wikipedia/wikipedia_en_top_maxi_2025-12.zim"
            "https://download.kiwix.org/zim/zimit/based.cooking_en_all_2026-02.zim"
            "https://download.kiwix.org/zim/zimit/armypubs_en_all_2024-12.zim"
